<!doctype html>
<!--
  lang="pt-BR" não é detalhe de acessibilidade: era "en", sobra do
  template do Vite, e com a página inteira em português o Chrome concluía
  que precisava TRADUZIR. O tradutor reescreve os nós de texto, e o
  resultado apareceu em produção como a aba "Transferências" virando
  literalmente "s".

  O risco real é maior que o rótulo torto. Traduzir esta tela é reescrever
  número de vale, valor, endereço e status — num sistema cuja regra
  central é a tela nunca afirmar o que ela não sabe. Corrupção silenciosa
  de texto aqui é da mesma família dos bugs que este projeto já pagou caro
  pra achar, com o agravante de vir de fora do código: nem o fonte, nem o
  bundle, nem um render isolado mostram o problema.
-->
<html lang="pt-BR" translate="no">
  <head>
    <meta charset="UTF-8" />
    <!--
      Duas travas, porque respondem a coisas diferentes:

      `lang="pt-BR"` acima tira o MOTIVO da tradução automática — o Chrome
      só oferece quando acha que a página está noutra língua. Resolve a
      causa, mas não impede alguém pedir tradução no menu.

      `translate="no"` (atributo padrão do HTML, no <html> acima) e esta
      meta do Google fecham também o pedido manual. Aqui isso vale a pena:
      não há o que ganhar traduzindo uma tela operacional em português
      para quem fala português, e há o que perder — número de vale, valor,
      endereço e status reescritos por um tradutor, em silêncio.
    -->
    <meta name="google" content="notranslate" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tele-entrega — Drogaria Cidade</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
